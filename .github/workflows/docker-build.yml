name: Build and Push AI Service Image
on:
  push:
    branches:
      - feature/fatimah-ai-service
    paths:
      - 'ai/api/**'
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./ai/api
          push: true
          tags: fatimahalzh/look-like-me-ai:latest
      - name: Notify backend to redeploy
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.BACKEND_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/Jana2Shata/look-like-me/dispatches \
            -d '{"event_type":"ai-image-updated"}'